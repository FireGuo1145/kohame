server:
  addr: ":3000"

ssh:
  # SSH Git service. Set addr to an empty string to disable it.
  addr: ":2222"
  # Public hostname shown in SSH clone URLs.
  host: "localhost"

storage:
  # Bare Git repositories are stored here. Relative paths are based on this file.
  repository_root: data/repos

database:
  # Supported values: sqlite, pgsql
  driver: sqlite
  # For sqlite this is a filesystem path. For pgsql use a PostgreSQL DSN.
  dsn: data/kohame.db

captcha:
  # Set enabled plus real hCaptcha keys to require hCaptcha on registration.
  enabled: false
  site_key: ""
  secret: ""
